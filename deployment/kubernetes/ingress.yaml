apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelsiem
  namespace: sentinelsiem
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - sentinelsiem.example.com
      secretName: sentinelsiem-tls
  rules:
    - host: sentinelsiem.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sentinelsiem-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sentinelsiem-frontend
                port:
                  number: 8080
