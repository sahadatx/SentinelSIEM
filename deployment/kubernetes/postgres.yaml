apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinelsiem-postgres-data
  namespace: sentinelsiem
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelsiem-postgres
  namespace: sentinelsiem
spec:
  serviceName: sentinelsiem-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sentinelsiem-postgres
  template:
    metadata:
      labels:
        app: sentinelsiem-postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: sentinelsiem
            - name: POSTGRES_USER
              value: sentinelsiem
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelsiem-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U sentinelsiem -d sentinelsiem"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sentinelsiem-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: sentinelsiem-postgres
  namespace: sentinelsiem
spec:
  selector:
    app: sentinelsiem-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
