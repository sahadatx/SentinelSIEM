apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelsiem-redis
  namespace: sentinelsiem
spec:
  serviceName: sentinelsiem-redis
  replicas: 1

  selector:
    matchLabels:
      app: sentinelsiem-redis

  template:
    metadata:
      labels:
        app: sentinelsiem-redis

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c

          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelsiem-secrets
                  key: REDIS_PASSWORD

          ports:
            - name: redis
              containerPort: 6379

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: sentinelsiem-redis
  namespace: sentinelsiem
spec:
  selector:
    app: sentinelsiem-redis

  ports:
    - name: redis
      port: 6379
      targetPort: redis

  type: ClusterIP