apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinelsiem-opensearch-config
  namespace: sentinelsiem

data:
  opensearch.yml: |
    # ----------------------------------------------------------------
    # Cluster
    # ----------------------------------------------------------------

    cluster.name: sentinelsiem
    discovery.type: single-node

    # ----------------------------------------------------------------
    # Network
    # ----------------------------------------------------------------

    network.host: 0.0.0.0
    http.port: 9200

    # ----------------------------------------------------------------
    # Security Plugin - Transport TLS
    #
    # Custom transport certificate signed by the SentinelSIEM Root CA.
    # Both serverAuth and clientAuth are present on the certificate.
    # ----------------------------------------------------------------

    plugins.security.ssl.transport.pemcert_filepath: tls/opensearch-transport.crt
    plugins.security.ssl.transport.pemkey_filepath: tls/opensearch-transport.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: tls/root-ca.pem
    plugins.security.ssl.transport.enforce_hostname_verification: true

    # Explicit node identity for the single-node cluster.
    plugins.security.nodes_dn:
      - "C=BD,O=SentinelSIEM,OU=Security,CN=sentinelsiem-opensearch"

    # ----------------------------------------------------------------
    # Security Plugin - HTTP TLS
    #
    # Custom HTTP certificate signed by the same SentinelSIEM Root CA.
    # SAN includes the Kubernetes service DNS names.
    # ----------------------------------------------------------------

    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: tls/opensearch-http.crt
    plugins.security.ssl.http.pemkey_filepath: tls/opensearch-http.key
    plugins.security.ssl.http.pemtrustedcas_filepath: tls/root-ca.pem

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sentinelsiem-opensearch
  namespace: sentinelsiem

spec:
  serviceName: sentinelsiem-opensearch
  replicas: 1

  selector:
    matchLabels:
      app: sentinelsiem-opensearch

  template:
    metadata:
      labels:
        app: sentinelsiem-opensearch

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: opensearch

          image: opensearchproject/opensearch:2.19.0
          imagePullPolicy: IfNotPresent

          env:
            # --------------------------------------------------------
            # Cluster
            # --------------------------------------------------------

            - name: discovery.type
              value: single-node

            # --------------------------------------------------------
            # Authentication
            # --------------------------------------------------------

            - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelsiem-secrets
                  key: OPENSEARCH_INITIAL_ADMIN_PASSWORD

            # --------------------------------------------------------
            # JVM
            # --------------------------------------------------------

            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          ports:
            - name: https
              containerPort: 9200
              protocol: TCP

            - name: metrics
              containerPort: 9600
              protocol: TCP

          # ----------------------------------------------------------
          # Readiness
          #
          # Validates:
          #   - HTTPS listener
          #   - CA trust
          #   - hostname/SAN validation
          #   - admin authentication
          # ----------------------------------------------------------

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl
                  --silent
                  --show-error
                  --fail
                  --cacert /usr/share/opensearch/config/tls/root-ca.pem
                  --resolve sentinelsiem-opensearch:9200:127.0.0.1
                  -u "admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
                  https://sentinelsiem-opensearch:9200/_cluster/health
                  >/dev/null

            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6

          # ----------------------------------------------------------
          # Liveness
          # ----------------------------------------------------------

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  curl
                  --silent
                  --show-error
                  --fail
                  --cacert /usr/share/opensearch/config/tls/root-ca.pem
                  --resolve sentinelsiem-opensearch:9200:127.0.0.1
                  -u "admin:${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
                  https://sentinelsiem-opensearch:9200/_cluster/health
                  >/dev/null

            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: "2"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          volumeMounts:

            # --------------------------------------------------------
            # Persistent OpenSearch data
            # --------------------------------------------------------

            - name: data
              mountPath: /usr/share/opensearch/data

            # --------------------------------------------------------
            # OpenSearch configuration
            # --------------------------------------------------------

            - name: opensearch-config
              mountPath: /usr/share/opensearch/config/opensearch.yml
              subPath: opensearch.yml
              readOnly: true

            # --------------------------------------------------------
            # Entire OpenSearch TLS Secret
            #
            # Mounting the whole Secret directory avoids individual
            # subPath mounts for TLS materials.
            # --------------------------------------------------------

            - name: opensearch-tls
              mountPath: /usr/share/opensearch/config/tls
              readOnly: true

      volumes:

        # ------------------------------------------------------------
        # Custom OpenSearch configuration
        # ------------------------------------------------------------

        - name: opensearch-config
          configMap:
            name: sentinelsiem-opensearch-config
            items:
              - key: opensearch.yml
                path: opensearch.yml

        # ------------------------------------------------------------
        # Dedicated OpenSearch TLS Secret
        #
        # Expected files:
        #
        #   root-ca.pem
        #   opensearch-http.crt
        #   opensearch-http.key
        #   opensearch-transport.crt
        #   opensearch-transport.key
        # ------------------------------------------------------------

        - name: opensearch-tls
          secret:
            secretName: sentinelsiem-opensearch-tls
            defaultMode: 0440

  # ------------------------------------------------------------------
  # Persistent OpenSearch storage
  # ------------------------------------------------------------------

  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 30Gi

---
apiVersion: v1
kind: Service
metadata:
  name: sentinelsiem-opensearch
  namespace: sentinelsiem

spec:
  selector:
    app: sentinelsiem-opensearch

  ports:
    - name: https
      port: 9200
      targetPort: https
      protocol: TCP

    - name: metrics
      port: 9600
      targetPort: metrics
      protocol: TCP

  type: ClusterIP