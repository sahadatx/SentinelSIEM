apiVersion: v1
kind: Secret
metadata:
  name: sentinelsiem-secrets
  namespace: sentinelsiem

type: Opaque

stringData:
  # ------------------------------------------------------------------
  # Application Authentication
  # ------------------------------------------------------------------

  SIEM_AUTH_SECRET_KEY: REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS

  # ------------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------------

  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_SECRET

  SIEM_DATABASE_URL: >-
    postgresql+asyncpg://sentinelsiem:REPLACE_WITH_A_STRONG_SECRET@sentinelsiem-postgres:5432/sentinelsiem

  # ------------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------------

  REDIS_PASSWORD: REPLACE_WITH_A_STRONG_SECRET

  # ------------------------------------------------------------------
  # OpenSearch Authentication
  # ------------------------------------------------------------------

  OPENSEARCH_INITIAL_ADMIN_PASSWORD: REPLACE_WITH_A_STRONG_SECRET

  # ------------------------------------------------------------------
  # OpenSearch TLS - Root CA
  # ------------------------------------------------------------------

  # Root CA certificate used to sign the OpenSearch HTTP certificate.
  #
  # The certificate must be the CA that signed
  # OPENSEARCH_HTTP_CERT_PEM.
  OPENSEARCH_ROOT_CA_PEM: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OPENSEARCH_ROOT_CA_CERTIFICATE
    -----END CERTIFICATE-----

  # ------------------------------------------------------------------
  # OpenSearch TLS - HTTP Server Certificate
  # ------------------------------------------------------------------

  # Server certificate presented by OpenSearch HTTPS on port 9200.
  #
  # IMPORTANT:
  # The Subject Alternative Name (SAN) MUST contain:
  #
  #   DNS:sentinelsiem-opensearch
  #
  # because the Kubernetes worker connects to:
  #
  #   https://sentinelsiem-opensearch:9200
  #
  OPENSEARCH_HTTP_CERT_PEM: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_OPENSEARCH_HTTP_SERVER_CERTIFICATE
    -----END CERTIFICATE-----

  # ------------------------------------------------------------------
  # OpenSearch TLS - HTTP Private Key
  # ------------------------------------------------------------------

  # Private key corresponding to OPENSEARCH_HTTP_CERT_PEM.
  #
  # Do not commit a real private key to the repository.
  OPENSEARCH_HTTP_KEY_PEM: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_OPENSEARCH_HTTP_PRIVATE_KEY
    -----END PRIVATE KEY-----


  # ------------------------------------------------------------------
  # SentinelSIEM generated OpenSearch TLS material
  # ------------------------------------------------------------------

  deployment/production/tls/opensearch/opensearch-root-ca.key
  deployment/production/tls/opensearch/opensearch-http.key
  deployment/production/tls/opensearch/opensearch-http.csr
  deployment/production/tls/opensearch/opensearch-root-ca.srl