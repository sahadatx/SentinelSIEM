
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siem-security-platform"
version = "0.1.0"
description = "Enterprise-oriented SIEM and Security Monitoring Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "typer>=0.15,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "opensearch-py>=2.8,<3.0",
    "redis>=6.0,<7.0",
    "aiohttp>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
siem = "app.cli.main:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["backend"]
