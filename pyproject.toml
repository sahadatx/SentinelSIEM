[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"


# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "siem-security-platform"
version = "0.1.0"
description = "Enterprise-oriented SIEM and Security Monitoring Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    # ------------------------------------------------------------------------
    # Web / API
    # ------------------------------------------------------------------------
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",

    # ------------------------------------------------------------------------
    # Data Validation / Configuration
    # ------------------------------------------------------------------------
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",

    # ------------------------------------------------------------------------
    # CLI
    # ------------------------------------------------------------------------
    "typer>=0.15,<1.0",

    # ------------------------------------------------------------------------
    # Database
    # ------------------------------------------------------------------------
    "sqlalchemy>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.16,<2.0",

    # ------------------------------------------------------------------------
    # Search / Analytics
    # ------------------------------------------------------------------------
    "opensearch-py>=2.8,<3.0",

    # ------------------------------------------------------------------------
    # Cache / Queue / Realtime
    # ------------------------------------------------------------------------
    "redis>=6.0,<7.0",

    # ------------------------------------------------------------------------
    # HTTP / Async Networking
    # ------------------------------------------------------------------------
    "aiohttp>=3.10,<4.0",

    # ------------------------------------------------------------------------
    # Authentication / Security
    # ------------------------------------------------------------------------
    "argon2-cffi>=23.1,<26.0",
    "PyJWT>=2.9,<3.0",
]


# ============================================================================
# Development Dependencies
# ============================================================================

[project.optional-dependencies]

dev = [
    # ------------------------------------------------------------------------
    # Testing
    # ------------------------------------------------------------------------
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.27,<1.0",

    # ------------------------------------------------------------------------
    # Static Analysis / Type Checking
    # ------------------------------------------------------------------------
    "mypy>=1.13,<2.0",
    "ruff>=0.8,<1.0",

    # ------------------------------------------------------------------------
    # Security Analysis
    # ------------------------------------------------------------------------
    "bandit>=1.7,<2.0",
    "pip-audit>=2.7,<3.0",

    # ------------------------------------------------------------------------
    # Packaging
    # ------------------------------------------------------------------------
    "build>=1.2,<2.0",
]


# ============================================================================
# CLI Entry Point
# ============================================================================

[project.scripts]

siem = "app.cli.main:main"


# ============================================================================
# Setuptools
# ============================================================================

[tool.setuptools]

package-dir = { "" = "backend" }


[tool.setuptools.packages.find]

where = [
    "backend",
]


[tool.setuptools.package-data]

app = [
    "storage/migrations/*.sql",
]


# ============================================================================
# Ruff
# ============================================================================

[tool.ruff]

target-version = "py312"
line-length = 100

src = [
    "backend",
    "backend/tests",
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

ignore = [
    "B008",
]


[tool.ruff.format]

quote-style = "double"
indent-style = "space"


# ============================================================================
# Mypy
# ============================================================================

[tool.mypy]

python_version = "3.12"
strict = true
mypy_path = "backend"

packages = [
    "app",
]


# ============================================================================
# Pytest
# ============================================================================

[tool.pytest.ini_options]

testpaths = [
    "backend/tests",
]

pythonpath = [
    "backend",
]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

asyncio_mode = "auto"